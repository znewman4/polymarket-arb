<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Polymarket Arb Report{% endblock %}</title>
<style>
  body { font-family: monospace; font-size: 13px; margin: 20px; background: #fafafa; color: #222; }
  h1 { font-size: 1.4em; border-bottom: 2px solid #333; padding-bottom: 6px; }
  h2 { font-size: 1.15em; margin-top: 2em; border-bottom: 1px solid #aaa; padding-bottom: 4px; }
  h3 { font-size: 1em; margin-top: 1.5em; }
  .summary-grid { display: flex; flex-wrap: wrap; gap: 12px; margin: 1em 0; }
  .summary-card { background: #fff; border: 1px solid #ccc; border-radius: 4px;
                  padding: 12px 18px; min-width: 140px; text-align: center; }
  .summary-card .value { font-size: 1.8em; font-weight: bold; color: #1a73e8; }
  .summary-card .label { font-size: 0.85em; color: #555; }
  table.report-table { border-collapse: collapse; width: 100%; margin: 0.5em 0; }
  table.report-table th { background: #333; color: #fff; padding: 5px 8px; text-align: left;
                           position: sticky; top: 0; }
  table.report-table td { padding: 4px 8px; border-bottom: 1px solid #ddd; }
  table.report-table tr:nth-child(even) { background: #f5f5f5; }
  .status-pass { color: #2e7d32; font-weight: bold; }
  .status-warn { color: #e65100; font-weight: bold; }
  .status-fail { color: #c62828; font-weight: bold; }
  .chart-img { max-width: 100%; height: auto; margin: 0.5em 0; }
  .empty-state { color: #888; font-style: italic; padding: 1em; }
  footer { margin-top: 3em; font-size: 0.8em; color: #888; border-top: 1px solid #ddd; padding-top: 8px; }
</style>
</head>
<body>
{% block header %}
<h1>{% block title_heading %}Polymarket Arb Report{% endblock %}</h1>
<p style="color:#666">Generated: {{ generated_at }}</p>
{% endblock %}

{% block content %}{% endblock %}

<footer>polymarket-arb — research only, no trading</footer>
</body>
</html>
