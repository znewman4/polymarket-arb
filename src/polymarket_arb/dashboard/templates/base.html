<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}polymarket-arb dashboard{% endblock %}</title>
  {% if auto_refresh_seconds and active_page == 'overview' %}
  <meta http-equiv="refresh" content="{{ auto_refresh_seconds }}">
  {% endif %}
  <style>
    :root {
      --bg: #0e1116;
      --bg-card: #161b22;
      --bg-card-2: #1c222b;
      --fg: #e6edf3;
      --fg-dim: #8b949e;
      --accent: #58a6ff;
      --good: #3fb950;
      --bad: #f85149;
      --warn: #d29922;
      --border: #30363d;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 12px 24px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
    }
    header .brand { font-weight: 700; letter-spacing: 0.02em; }
    nav a {
      padding: 4px 8px;
      border-radius: 6px;
      color: var(--fg-dim);
    }
    nav a.active, nav a:hover { color: var(--fg); background: var(--bg-card-2); }
    main { padding: 24px; max-width: 1400px; margin: 0 auto; }
    h1, h2 { margin: 0 0 12px; }
    h1 { font-size: 20px; }
    h2 { font-size: 16px; color: var(--fg-dim); font-weight: 600; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
    .card .label { color: var(--fg-dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
    .card .value { font-size: 28px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .card .sub { color: var(--fg-dim); font-size: 12px; margin-top: 4px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    th { color: var(--fg-dim); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
    tbody tr:hover { background: var(--bg-card-2); }
    .mono { font-family: var(--mono); }
    .empty { color: var(--fg-dim); font-style: italic; padding: 16px; text-align: center; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; }
    .pill.good { background: rgba(63,185,80,0.15); color: var(--good); }
    .pill.bad { background: rgba(248,81,73,0.15); color: var(--bad); }
    .pill.warn { background: rgba(210,153,34,0.15); color: var(--warn); }
    .pill.neutral { background: var(--bg-card-2); color: var(--fg-dim); }
    form.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: end; }
    form.filters label { font-size: 12px; color: var(--fg-dim); display: block; }
    form.filters input, form.filters select {
      background: var(--bg-card-2); color: var(--fg); border: 1px solid var(--border);
      border-radius: 6px; padding: 6px 8px; font: inherit;
    }
    .btn { background: var(--accent); color: #fff; padding: 6px 12px; border-radius: 6px; border: 0; cursor: pointer; }
    .btn.secondary { background: var(--bg-card-2); color: var(--fg); border: 1px solid var(--border); }
    .pagination { display: flex; gap: 8px; margin-top: 12px; align-items: center; color: var(--fg-dim); font-size: 12px; }
    canvas { max-width: 100%; }
  </style>
</head>
<body>
  <header>
    <div class="brand">polymarket-arb</div>
    <nav>
      <a href="/" class="{{ 'active' if active_page == 'overview' else '' }}">Overview</a>
      <a href="/orders" class="{{ 'active' if active_page == 'orders' else '' }}">Orders</a>
      <a href="/signals" class="{{ 'active' if active_page == 'signals' else '' }}">Signals</a>
      <a href="/markets" class="{{ 'active' if active_page == 'markets' else '' }}">Markets</a>
      <a href="/health">Health (JSON)</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
