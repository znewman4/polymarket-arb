# VPS deployment: continuous orderbook recorder + paper-trading agent.
#
# Five services share one image and one ./data bind mount:
#   recorder              — continuously refreshes markets and snapshots active orderbooks,
#                           populating data/normalised/ so the agent and future backtests
#                           have fresh data to read.
#   agent                 — runs ``polymarket-arb live agent`` indefinitely in paper-mode.
#   limitless-arb         — runs ``polymarket-arb limitless scan-arb --execute`` every 5
#                           minutes, paper-trading the Limitless x Polymarket arb strategy
#                           and logging both legs to data/normalised/orders_log/.
#   relationship-miner    — runs ``polymarket-arb relationships validate`` every 6 hours,
#                           scoring and promoting relationship candidates in the lake.
#   dashboard             — Flask read-only dashboard over the parquet lake, published on
#                           host port 5000.  Reach it via SSM port-forwarding from a
#                           laptop (see deploy/README.md).
#
# Both services:
#   - mount the kill-switch file from the host so ``touch .killswitch``
#     halts trading without restarting the container.
#   - load secrets from ../.env (gitignored).
#   - restart on crash (``restart: unless-stopped``).
#   - run the Docker healthcheck defined in Dockerfile.agent.
#
# Flipping to live trading requires editing .env to set BOTH
# ``POLYMARKET_ARB_PAPER_MODE=false`` AND
# ``POLYMARKET_ARB_ORDERS_ALLOWED=true`` AND providing
# ``POLYMARKET_PRIVATE_KEY``.  The OrderClient still refuses to submit while
# signing.py is a stub — see plan Phase 3.

services:
  recorder:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.agent
    image: polymarket-arb:agent
    container_name: polymarket-arb-recorder
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - POLYMARKET_ARB_ENV=${POLYMARKET_ARB_ENV:-prod}
      # Recorder never needs the trade gate flipped — keep them safe.
      - POLYMARKET_ARB_ORDERS_ALLOWED=false
      - POLYMARKET_ARB_PAPER_MODE=true
    volumes:
      - ../data:/app/data
      - ../configs:/app/configs:ro
    entrypoint: []
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          python -m polymarket_arb.cli maintenance compact-lake --older-than-days 0 --min-files 5
          python -m polymarket_arb.cli fetch-markets --all --max-pages 50
          python -m polymarket_arb.cli snapshot-candidate-tokens --limit 3000
          python -m polymarket_arb.cli snapshot-active-markets --limit 500
          find /app/data/normalised -name "*.parquet" -mtime +3 -delete
          find /app/data/raw -name "*.json" -mtime +1 -delete
          sleep 300
        done
    healthcheck:
      test:
        - CMD-SHELL
        - test -n "$$(find /app/data/normalised/orderbook_snapshots/dt=$$(date -u +%Y-%m-%d) -maxdepth 1 -name '*.parquet' -print -quit 2>/dev/null)"
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.agent
    image: polymarket-arb:agent
    container_name: polymarket-arb-agent
    restart: unless-stopped
    depends_on:
      - recorder
    env_file:
      - ../.env
    environment:
      - POLYMARKET_ARB_ENV=${POLYMARKET_ARB_ENV:-prod}
      # Safe default: paper mode + orders disallowed.  Override in .env to flip.
      - POLYMARKET_ARB_PAPER_MODE=${POLYMARKET_ARB_PAPER_MODE:-true}
      - POLYMARKET_ARB_ORDERS_ALLOWED=${POLYMARKET_ARB_ORDERS_ALLOWED:-false}
    volumes:
      - ../data:/app/data
      - ../configs:/app/configs:ro
    # The agent auto-populates watched tokens from eligible relationship
    # candidates in the lake, then polls each token's latest orderbook from
    # the recorder service every poll-interval-s seconds.
    command:
      - live
      - agent
      - --poll-interval-s
      - "${POLYMARKET_ARB_AGENT_POLL_INTERVAL_S:-10}"
      - --strategy
      - "${POLYMARKET_ARB_AGENT_STRATEGY:-noop}"
      - --strategy-auto-tokens
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  limitless-arb:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.agent
    image: polymarket-arb:agent
    container_name: polymarket-arb-limitless-arb
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - POLYMARKET_ARB_ENV=${POLYMARKET_ARB_ENV:-prod}
      # Paper mode on by default. Set POLYMARKET_ARB_LIMITLESS_PAPER_MODE=false
      # in .env (alongside real Limitless API creds) to go live.
      - POLYMARKET_ARB_LIMITLESS_PAPER_MODE=${POLYMARKET_ARB_LIMITLESS_PAPER_MODE:-true}
      - POLYMARKET_ARB_ORDERS_ALLOWED=false
      - POLYMARKET_ARB_PAPER_MODE=true
    volumes:
      - ../data:/app/data
      - ../configs:/app/configs:ro
    entrypoint: []
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          python -m polymarket_arb.cli limitless scan-arb \
            --execute \
            --stake-usdc "${POLYMARKET_ARB_LIM_STAKE_USDC:-50}" \
            --tolerance "${POLYMARKET_ARB_LIM_TOLERANCE:-0.02}" \
            --threshold "${POLYMARKET_ARB_LIM_THRESHOLD:-0.82}" \
            --min-net-edge "${POLYMARKET_ARB_LIM_MIN_NET_EDGE:-0.02}"
          sleep 300
        done
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    image: polymarket-arb:agent
    container_name: polymarket-arb-dashboard
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - POLYMARKET_ARB_ENV=${POLYMARKET_ARB_ENV:-prod}
      # Dashboard is read-only — never needs the trade gates.
      - POLYMARKET_ARB_ORDERS_ALLOWED=false
      - POLYMARKET_ARB_PAPER_MODE=true
    volumes:
      - ../data:/app/data
      - ../configs:/app/configs:ro
    # 0.0.0.0 inside the container so SSM port-forward can reach it.
    ports:
      - "5000:5000"
    command:
      - dashboard
      - serve
      - --host
      - "0.0.0.0"
      - --port
      - "5000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  relationship-miner:
    image: polymarket-arb:agent
    container_name: polymarket-arb-relationship-miner
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - POLYMARKET_ARB_ENV=${POLYMARKET_ARB_ENV:-prod}
      - POLYMARKET_ARB_ORDERS_ALLOWED=false
      - POLYMARKET_ARB_PAPER_MODE=true
    volumes:
      - ../data:/app/data
      - ../configs:/app/configs:ro
    entrypoint: []
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          python -m polymarket_arb.cli relationships validate
          sleep 21600
        done
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
